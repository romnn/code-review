# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
    ZIGBUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild:latest
    GORELEASER_VERSION: "2.20.0"

tasks:
    deps:linux:
        desc: "install the system libraries review-gui links against on Debian and Ubuntu"
        cmds:
            # review-gui builds gpui for Wayland only and links libxkbcommon. freetype is built from
            # source unless libfreetype-dev is installed. At run time the app also needs a Wayland
            # compositor and a Vulkan driver, which it loads dynamically.
            - sudo apt-get update
            - sudo apt-get install -y --no-install-recommends libxkbcommon-dev

    format:
        desc: "format all crates"
        cmds:
            - cargo fmt --all {{.CLI_ARGS}}

    check:
        desc: "check the workspace for the host target"
        cmds:
            - cargo check --workspace --all-targets {{.CLI_ARGS}}

    check:fc:
        desc: "check all configured targets and feature combinations"
        cmds:
            - cargo fc check --all-targets {{.CLI_ARGS}}

    test:
        desc: "run tests"
        cmds:
            - cargo nextest run -P default --workspace --all-targets --no-tests warn {{.CLI_ARGS}}

    test:fc:
        desc: "run tests for every feature combination"
        cmds:
            - cargo fc nextest run -P default --all-targets --no-tests warn {{.CLI_ARGS}}

    test:doc:
        desc: "run doc-tests"
        cmds:
            - cargo test --doc --workspace {{.CLI_ARGS}}

    lint:
        desc: "lint the workspace"
        cmds:
            - cargo lint --workspace --all-features {{.CLI_ARGS}}

    lint:fc:
        desc: "lint all configured targets and feature combinations"
        cmds:
            - cargo fc lint {{.CLI_ARGS}}

    lint:fix:
        desc: "apply clippy fixes"
        aliases: [fix]
        cmds:
            - cargo fixit --workspace --all-features {{.CLI_ARGS}}

    qa:
        desc: "drive review-gui in headless sway with a QA script, e.g. task qa -- scripts/qa/smoke.qa"
        cmds:
            - scripts/qa/run.sh {{.CLI_ARGS}}

    qa:tui:
        desc: "drive review-tui off screen with a QA script, e.g. task qa:tui -- scripts/qa/smoke-tui.qa"
        env:
            QA_FRONT_END: tui
        cmds:
            - scripts/qa/run.sh {{.CLI_ARGS}}

    docs:screenshots:
        desc: "render every screenshot scene of review-gui and review-tui and copy the ones README.md shows into docs/screenshots (needs sway, grim and the mise tools)"
        aliases: [screenshots]
        sources: &screenshot-sources
            - scripts/screenshots/*
            - scripts/qa/run.sh
            - crates/*/src/**/*.rs
            - crates/*/Cargo.toml
            - crates/review-ui/themes/*.toml
            - crates/review-core/demo/**/*
            - Cargo.lock
            - README.md
        generates:
            - target/screenshots/all/*/*.png
            - docs/screenshots/*/*.png
        cmds:
            - scripts/screenshots/run.sh {{.CLI_ARGS}}

    docs:screenshots:gallery:
        desc: "render one scene in every theme and diff style, in both front ends, under target/screenshots/gallery/"
        aliases: ["screenshots:gallery"]
        sources: *screenshot-sources
        generates:
            - target/screenshots/gallery/*/*.png
        cmds:
            - scripts/screenshots/run.sh --gallery {{.CLI_ARGS}}

    lint:actions:
        desc: "lint GitHub Actions workflows"
        cmds:
            - actionlint {{.CLI_ARGS}}

    audit:
        desc: "audit dependencies for security advisories"
        cmds:
            - cargo audit {{.CLI_ARGS}}

    unused:
        desc: "find unused dependencies"
        aliases: [unused-dependencies]
        cmds:
            - cargo +nightly fc udeps --maximal-features --all-targets {{.CLI_ARGS}}

    lint:ast-grep:
        desc: "check source structure with the ast-grep rules in .ast-grep/rules"
        aliases: [lint:ast]
        cmds:
            - ast-grep test
            # Without `COLORFGBG`, ast-grep asks the terminal for its background color and stops
            # listening after 20 ms; a terminal that answers later leaves the raw reply in the
            # shell's input. A dark background is assumed when the terminal does not set it.
            - COLORFGBG="${COLORFGBG:-15;0}" ast-grep scan --error {{.CLI_ARGS}}

    typos:
        desc: "spellcheck"
        aliases: [spellcheck]
        cmds:
            - typos {{.CLI_ARGS}}

    build:
        desc: "build all targets"
        cmds:
            - cargo build --all-targets {{.CLI_ARGS}}

    build:release:
        desc: "build all targets in release mode"
        cmds:
            - cargo build --all-targets --release {{.CLI_ARGS}}

    goreleaser:
        internal: true
        requires:
            vars: [GORELEASER_ARGS]
        cmds:
            # The image ships zig, cargo-zigbuild, rust and every release target; only goreleaser
            # is missing. safe.directory: the bind-mounted repo is owned by another uid.
            - >-
                docker run --rm -e GITHUB_TOKEN -e TAP_GITHUB_TOKEN -e "HOST_UID=$(id -u)" -e
                "HOST_GID=$(id -g)" {{.DOCKER_ENV}} -v "${PWD}:/workspace" -w /workspace
                {{.ZIGBUILD_IMAGE}} bash -euo pipefail -c ' fix_perms() { for d in target
                goreleaser-dist; do [ -e "$d" ] && chown -R "${HOST_UID}:${HOST_GID}" "$d" || true;
                done; }; trap fix_perms EXIT; case "$(uname -m)" in x86_64) arch=x86_64 ;;
                aarch64|arm64) arch=arm64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac; curl
                -sSfL
                "https://github.com/goreleaser/goreleaser/releases/download/v{{.GORELEASER_VERSION}}/goreleaser_Linux_${arch}.tar.gz"
                | tar -xz -C /usr/local/bin goreleaser; git config --global --add safe.directory
                "$(pwd)"; goreleaser {{.GORELEASER_ARGS}}'

    build:goreleaser:
        desc: "cross-build every release target using goreleaser, without release optimizations"
        cmds:
            - task: goreleaser
              vars:
                  GORELEASER_ARGS: "build --snapshot --clean"
                  # The snapshot only proves that every target compiles and links.
                  # LTO with one codegen unit dominates its build time, and `task release` keeps it.
                  DOCKER_ENV: >-
                      -e CARGO_PROFILE_RELEASE_OPT_LEVEL=0 -e CARGO_PROFILE_RELEASE_LTO=off -e
                      CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256

    release:
        desc: "release using goreleaser"
        cmds:
            - task: goreleaser
              vars: { GORELEASER_ARGS: "release --clean" }

    outdated:
        desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
        cmds:
            - "cooldown outdated --sync {{.CLI_ARGS}}"

    outdated:minor:
        desc: "list outdated deps within the current major only"
        cmds:
            - "cooldown outdated --no-major --sync {{.CLI_ARGS}}"

    upgrade:
        desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
        aliases: [update]
        cmds:
            - "cooldown upgrade --major --sync {{.CLI_ARGS}}"

    upgrade:minor:
        desc: "upgrade all deps within their current major, within the cooldown"
        cmds:
            - "cooldown upgrade --no-major --sync {{.CLI_ARGS}}"

    upgrade:latest:
        desc: "upgrade ignoring the cooldown window — use deliberately"
        prompt:
            - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly
              compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
        cmds:
            - "cooldown upgrade --latest {{.CLI_ARGS}}"

    mise:upgrade:
        desc: "upgrade mise-managed tools and refresh the lockfile"
        env:
            # A fresh release is invisible for up to an hour behind mise's remote-versions cache
            # (fetch_remote_versions_cache = "1h"); upgrading is exactly when the listing must be live.
            MISE_FETCH_REMOTE_VERSIONS_CACHE: "0s"
            # mise resolves `latest` for GitHub tools through its hosted version index, which trails a
            # fresh release even with that cache off.
            # Asking GitHub directly lets an upgrade adopt a release the moment it is published.
            MISE_USE_VERSIONS_HOST: "0"
        cmds:
            - mise upgrade {{.CLI_ARGS}}
            - mise lock
