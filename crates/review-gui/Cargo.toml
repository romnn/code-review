[package]
name = "review-gui"
description = "Standalone desktop review app built on gpui and gpui-component"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
color-eyre.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui-platform = { workspace = true, features = ["wayland"] }
indoc.workspace = true
review-ui.workspace = true
serde_json.workspace = true
clap.workspace = true

[lints]
workspace = true

[package.metadata.cargo-fc]
# gpui's build scripts need platform toolchains that a Linux host lacks when cross-linting: the
# Windows build compiles a resource file with windres, and the macOS build compiles Metal
# shaders with Xcode's `metal`. The app is therefore linted and tested on Linux only, and the
# macOS and Windows test jobs skip it.
# Every other crate, review-ui and review-tui included, has no gpui and keeps all three targets.
targets = ["x86_64-unknown-linux-gnu"]
