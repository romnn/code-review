[package]
name = "review-cli"
description = "The cr command: the terminal review app, and commands for scripts and agents"
# It runs review-tui, which is GPL-3.0-or-later.
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cr"
path = "src/main.rs"

[dependencies]
clap.workspace = true
color-eyre.workspace = true
review-core.workspace = true
review-tui.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
color-eyre.workspace = true
indoc.workspace = true
tempfile.workspace = true

[features]
default = ["pdf"]
# A changed PDF's page diff; see review-ui's `pdf`. The static Linux release builds without it.
pdf = ["review-tui/pdf"]

[lints]
workspace = true

[package.metadata.cargo-fc]
# `default` enables exactly `pdf`, so the `default` row already covers it.
exclude_features = ["pdf"]
