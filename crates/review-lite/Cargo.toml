[package]
name = "review-lite"
description = "Standalone desktop review app built on gpui and gpui-component"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
color-eyre.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-platform = { workspace = true, features = ["wayland"] }
review-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.cargo-fc]
# gpui's build scripts need platform toolchains that a Linux host lacks when cross-linting: the
# Windows build compiles a resource file with windres, and the macOS build compiles Metal
# shaders with Xcode's `metal`. The app is therefore linted and tested on Linux only, and the
# macOS and Windows test jobs skip it; the other crates keep all three targets.
targets = ["x86_64-unknown-linux-gnu"]
