[package]
name = "review-tui"
description = "Terminal review app built on ratatui, drawing the same model as review-gui"
# It draws review-ui's model, which is GPL-3.0-or-later.
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
color-eyre.workspace = true
crossterm.workspace = true
image.workspace = true
parking_lot.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
review-ui.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-perfetto = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
signal-hook.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[dev-dependencies]
indoc.workspace = true
review-core.workspace = true
tempfile.workspace = true

[features]
default = ["pdf"]
# A changed PDF's page diff; see review-ui's `pdf`.
pdf = ["review-ui/pdf"]
# `--trace-output`, a Perfetto trace of the app's spans for profiling.
trace = ["dep:tracing-perfetto", "dep:tracing-subscriber"]

[lints]
workspace = true

[package.metadata.cargo-fc]
# `default` enables exactly `pdf`, so the `default` row already covers it.
exclude_features = ["pdf"]
