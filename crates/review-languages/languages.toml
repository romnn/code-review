# The languages cr highlights, one row each, and the one source of truth of review-ui's registry
# (ADR 3).
# build.rs fetches and compiles the grammar of every tree-house-tier row that pins one, fetches
# Helix's queries at the `helix` commit and embeds them, and generates `LANGUAGES` from the rows.
#
# A row has:
#
# - `name`: Helix's name for the language, which injections use, such as `markdown.inline`.
# - `tier`, named for the project whose work highlights the row: `tree-house`, highlighted by
#   tree-house with its grammar and Helix's queries under `runtime/queries/<queries>/`, with every
#   directory their `; inherits:` lines name, or `bat`, highlighted by syntect with the bat syntax
#   `bat` names.
# - Its grammar: `proof`, the language of review-core's formatting proof whose grammar crate it
#   shares and whose scopes it shows, or `[language.grammar]`, fetched from `git` at `rev`, in
#   `subpath` when the grammar is not the repository's root.
#   The fetched grammar's `sources` under `src/` are compiled, its `license-file` (LICENSE by
#   default) has the SPDX `license`, and its C entry point is `tree_sitter_<name>`, where `name`
#   is the row's unless the grammar names another.
# - `aliases` and `injection-regex`: the names fences and injections call it by, matched whole and
#   ignoring case.
# - Its detection: `extensions` without the dot, whole `filenames`, `globs` over the path, where
#   `*` also crosses `/`, and the interpreters of a `#!` line in `shebangs`.
# - `bat`: the bat syntax that highlights the row in the bat tier, kept by hand.
# - `data`, for a template language: the `nodes` of its grammar that hold the template's literal
#   text, which is highlighted as the language of the file the template produces, such as YAML
#   for `values.yaml.gotmpl`.
# - `local-queries = true`: the row's queries are cr's own, under `queries/<queries>/` beside
#   this manifest, rather than Helix's.
#
# A language moves between the tiers by its `tier` alone.
# Its names and detection stay, and its grammar stays pinned for when it moves back, but only the
# tree-house tier's grammars are compiled and its queries embedded.
#
# `task grammars:sync -- <helix commit>` moves every row to that commit of Helix: its grammar's
# `git`, `rev` and `subpath`, its detection and its injection regex, as Helix's languages.toml has
# them.
# `locked = true` keeps it from moving a row, and a list of fields, such as
# `locked = ["extensions"]`, keeps only those; `grammar` stands for the grammar's pin.

helix = "a714a818a3a4f6dd5aad3b003a78692f90a1703f"

[[language]]
name = "rust"
tier = "tree-house"
queries = "rust"
proof = "rust"
injection-regex = "rs|rust"
extensions = ["rs"]
shebangs = ["rust-script", "cargo"]

[[language]]
name = "python"
tier = "tree-house"
queries = "python"
proof = "python"
aliases = ["python3", "py3"]
injection-regex = "py(thon)?"
# spellcheck:ignore-next-line
extensions = ["py", "pyi", "py3", "pyw", "ptl", "rpy", "cpy", "ipy", "pyt"]
filenames = [".python_history", ".pythonstartup", ".pythonrc"]
globs = ["*SConstruct", "*SConscript", "*sconstruct"]
shebangs = ["python", "uv"]

# review-core parses JavaScript with the TSX grammar, whose trees Helix's JavaScript queries
# do not fit, so it takes TSX's queries, and `.jsx`, which Helix gives a language of its own.
[[language]]
name = "javascript"
tier = "tree-house"
queries = "tsx"
proof = "javascript"
aliases = ["jsx", "mjs", "cjs", "node"]
injection-regex = "(js|javascript)"
extensions = ["js", "mjs", "cjs", "jsx", "rules", "es6", "pac", "gs"]
filenames = [".node_repl_history", "jakefile"]
shebangs = ["node"]
locked = ["extensions"]

[[language]]
name = "typescript"
tier = "tree-house"
queries = "typescript"
proof = "typescript"
aliases = ["mts", "cts"]
injection-regex = "(ts|typescript)"
extensions = ["ts", "mts", "cts"]
shebangs = ["deno", "bun", "ts-node"]

[[language]]
name = "tsx"
tier = "tree-house"
queries = "tsx"
proof = "tsx"
injection-regex = "(tsx)"
extensions = ["tsx"]

[[language]]
name = "go"
tier = "tree-house"
queries = "go"
proof = "go"
aliases = ["golang"]
injection-regex = "go"
extensions = ["go"]

[[language]]
name = "json"
tier = "tree-house"
queries = "json"
proof = "json"
aliases = ["jsonc", "jsonl"]
injection-regex = "json"
extensions = [
  "json", "arb", "ipynb", "geojson", "gltf", "webmanifest", "js.map", "ts.map", "css.map", "jsonl",
  "avsc", "ldtk", "ldtkl", "sublime-build", "sublime-color-scheme", "sublime-commands",
  "sublime-completions", "sublime-keymap", "sublime-macro", "sublime-menu", "sublime-mousemap",
  "sublime-project", "sublime-settings", "sublime-theme", "sublime-workspace", "code-workspace",
  "tfstate",
]
filenames = [
  "flake.lock", ".babelrc", ".bowerrc", ".jscrc", ".jslintrc", ".vuerc", "composer.lock",
  ".watchmanconfig", ".swift-format", "devenv.lock", "devbox.lock", "manifest.lock", "deno.lock",
]
globs = [".pytest_cache/v/cache/*", "*.tfstate.backup"]

[[language]]
name = "toml"
tier = "tree-house"
queries = "toml"
proof = "toml"
injection-regex = "toml"
extensions = ["toml"]
filenames = [
  "pdm.lock", "poetry.lock", "Cargo.lock", "uv.lock", "containers.conf", "mounts.conf",
  "policy.conf", "registries.conf", "storage.conf", "staticcheck.conf",
]
globs = ["containers.conf.d/*.conf", "containers.conf.modules/*.conf"]

[[language]]
name = "bash"
tier = "tree-house"
queries = "bash"
aliases = ["shellscript", "ksh"]
injection-regex = "(shell|bash|zsh|sh)"
extensions = [
  "sh", "bash", "ash", "dash", "ksh", "mksh", "zsh", "zshenv", "zlogin", "zlogout", "zprofile",
  "zshrc", "eclass", "ebuild", "bazelrc", "Renviron", "zsh-theme", "cshrc", "tcshrc",
  "bashrc_Apple_Terminal", "zshrc_Apple_Terminal",
]
filenames = [
  ".tmux.conf", "tmux.conf", ".sh_history", ".bash_history", ".bash_login", ".bash_logout",
  ".bash_profile", ".bashrc", ".profile", ".zshenv", ".zlogin", ".zlogout", ".zprofile", ".zshrc",
  ".zimrc", "APKBUILD", ".bash_aliases", "bash_completion", ".Renviron", ".xprofile", ".xsession",
  ".xsessionrc", ".yashrc", ".yash_profile", ".hushlogin", ".xinitrc", "xinitrc", ".xserverrc",
  "xserverrc", "direnvrc",
]
globs = [
  "i3/config", "sway/config", "bash-completion/completions/*", "bash_completion.d/*",
  "bin/activate",
]
shebangs = ["sh", "bash", "dash", "zsh"]

[language.grammar]
git = "https://github.com/tree-sitter/tree-sitter-bash"
rev = "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
sources = ["parser.c", "scanner.c"]
license = "MIT"

[[language]]
name = "markdown"
tier = "tree-house"
queries = "markdown"
injection-regex = "md|markdown"
extensions = [
  "md", "livemd", "markdown", "mdx", "mkd", "mkdn", "mdwn", "mdown", "markdn", "mdtxt", "mdtext",
  "workbook",
]
filenames = ["PULLREQ_EDITMSG"]

[language.grammar]
git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown"
rev = "f969cd3ae3f9fbd4e43205431d0ae286014c05b5"
subpath = "tree-sitter-markdown"
sources = ["parser.c", "scanner.c"]
license = "MIT"

[[language]]
