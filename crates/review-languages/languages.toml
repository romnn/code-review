# Template languages: each row's `data` nodes take the language of the file the template
# produces, and its own injections give their language when the file's name says nothing.
# Go templates also take `.tmpl`, as Go and chezmoi name them.
[[language]]
name = "gotmpl"
tier = "tree-house"
queries = "gotmpl"
injection-regex = "gotmpl"
extensions = ["gotmpl", "tmpl"]
data = { nodes = ["text"] }
locked = ["extensions"]

[language.grammar]
git = "https://github.com/ngalaiko/tree-sitter-go-template"
rev = "aa71f63de226c5592dfbfc1f29949522d7c95fac"
sources = ["parser.c"]
license = "MIT"

# Helm's templates are Go templates whose text is YAML unless their name says otherwise.
[[language]]
name = "helm"
tier = "tree-house"
queries = "helm"
globs = ["templates/*.yaml", "templates/*.yml", "templates/_*.tpl", "templates/NOTES.txt"]
data = { nodes = ["text"] }

[language.grammar]
name = "gotmpl"
git = "https://github.com/ngalaiko/tree-sitter-go-template"
rev = "aa71f63de226c5592dfbfc1f29949522d7c95fac"
sources = ["parser.c"]
license = "MIT"

# Jinja takes cr's fork of cathaysia's grammar, which nvim-treesitter uses, rather than Helix's,
# whose text is anonymous and whose queries paint expressions as strings.
# The fork is cathaysia's v0.13.1 without Jinja's optional line syntax, line statements (`# if`)
# and line comments (`##`), which Jinja enables only when configured to, so such lines are text:
# `## Heading` in `README.md.j2` is Markdown.
# Its queries are cr's, derived from the grammar's own.
[[language]]
name = "jinja"
tier = "tree-house"
queries = "jinja"
local-queries = true
aliases = ["nunjucks"]
injection-regex = "jinja"
extensions = ["jinja", "jinja2", "j2", "njk"]
data = { nodes = ["content", "raw_body"] }
locked = true

[language.grammar]
git = "https://github.com/romnn/tree-sitter-jinja"
rev = "68cdfae2d1a3c1fa0563b23f5a56ce36f67b02b6"
subpath = "tree-sitter-jinja"
sources = ["parser.c", "scanner.c"]
license = "Apache-2.0"

[[language]]
name = "erb"
tier = "tree-house"
queries = "erb"
injection-regex = "erb"
extensions = ["erb"]
data = { nodes = ["content"] }

[language.grammar]
name = "embedded_template"
git = "https://github.com/tree-sitter/tree-sitter-embedded-template"
rev = "5bce9d580d3b78f48e13e331f69dfa0abd4ff68b"
sources = ["parser.c"]
license = "MIT"

[[language]]
name = "ejs"
tier = "tree-house"
queries = "ejs"
injection-regex = "ejs"
extensions = ["ejs"]
data = { nodes = ["content"] }

[language.grammar]
