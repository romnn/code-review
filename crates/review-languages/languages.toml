# Its scanner is C++, which includes schema.generated.cc itself.
[language.grammar]
git = "https://github.com/ikatyang/tree-sitter-yaml"
rev = "0e36bed171768908f331ff7dff9d956bae016efb"
sources = ["parser.c", "scanner.cc"]
license = "MIT"

# `.h` is C, the deterministic default for a header both C and C++ use; Helix makes it C++.
[[language]]
name = "c"
tier = "tree-house"
queries = "c"
injection-regex = "c"
extensions = ["c", "h", "h.in"]
locked = ["extensions"]

[language.grammar]
git = "https://github.com/tree-sitter/tree-sitter-c"
rev = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"
sources = ["parser.c"]
license = "MIT"

# Without `.h`, which is C; Helix's `.hpp.in` glob only matches a file of that name, so it is
# an extension here.
[[language]]
name = "cpp"
tier = "tree-house"
queries = "cpp"
aliases = ["c++", "cxx", "cc", "hpp"]
injection-regex = "cpp"
extensions = [
  "cc", "hh", "c++", "cpp", "hpp", "ipp", "tpp", "cxx", "hxx", "ixx", "txx", "ino", "C", "H", "cu",
  "cuh", "cppm", "h++", "ii", "inl", "hpp.in",
]
