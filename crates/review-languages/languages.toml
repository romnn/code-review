license-file = "LICENCE"

# The bat tier.
# SQL's grammar, tree-sitter-sequel, is a 47 MB parser.c with about 10 MB of parse tables, too
# much for every `cr` to carry until a comparison shows it highlights SQL better.
[[language]]
name = "sql"
tier = "bat"
bat = "SQL"
injection-regex = "sql"
extensions = ["sql", "dsql"]
