# Defaults for the ledger chart; helmfile overrides them per environment.
replicaCount: 1

image:
  repository: ghcr.io/example/ledger
  tag: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  host: ledger.example.net

reconcile:
  schedule: "*/15 * * * *"
  limit: 250
