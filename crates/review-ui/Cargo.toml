[package]
name = "review-ui"
description = "The review front ends' shared model: the review window's state and behavior, configuration, themes, rows and keymap"
# The syntax highlighting queries are copied from Zed, which is GPL-3.0-or-later.
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
review-core.workspace = true
serde.workspace = true
# QA mode's answers keep their keys in the order they are written, as review-gui's always
# have through gpui, so every front end's answers read alike.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tree-sitter.workspace = true
tree-sitter-toml-ng.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
