[package]
name = "review-ui"
description = "The review front ends' shared model: the review window's state and behavior, configuration, themes, rows and keymap"
# The apps that contain it are GPL-3.0-or-later; see PLAN.md, "License".
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
# The formats a changed image's comparison decodes.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "webp"] }
nucleo-matcher.workspace = true
notify.workspace = true
parking_lot.workspace = true
pdfium-embed = { workspace = true, optional = true }
regex.workspace = true
review-core.workspace = true
review-languages.workspace = true
ropey.workspace = true
serde.workspace = true
# QA mode's answers keep their keys in the order they are written, as review-gui's always
# have through gpui, so every front end's answers read alike.
serde_json = { workspace = true, features = ["preserve_order"] }
syntect.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tree-house.workspace = true
tree-sitter-go.workspace = true
tree-sitter-json.workspace = true
tree-sitter-language.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
two-face.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
color-eyre.workspace = true
indoc.workspace = true
png.workspace = true
tempfile.workspace = true

[features]
default = ["pdf"]
# A changed PDF's page-by-page text diff and rendered pages, through the pdfium library the
# build embeds; without it a changed PDF is a binary file.
pdf = ["dep:pdfium-embed"]

[lints]
workspace = true

[package.metadata.cargo-fc]
# `default` enables exactly `pdf`, so the `default` row already covers it.
exclude_features = ["pdf"]
