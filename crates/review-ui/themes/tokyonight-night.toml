# Tokyo Night (night), from tokyonight.nvim by folke (Apache-2.0):
# lua/tokyonight/colors/night.lua and storm.lua, with its highlight groups' choices.
name = "tokyonight-night"
title = "Tokyo Night"

[ui]
background = "#1a1b26"
panel = "#16161e"
band = "#1f2030"
raised = "#292e42"
hairline = "#292e42"
text = "#c0caf5"
dim = "#a9b1d6"
faint = "#565f89"
accent = "#7aa2f7"
selection = "#33467c"
find = "#3d59a1"
error = "#f7768e"
note = "#e0af68"

[review]
open = "#c0caf5"
done = "#9ece6a"
flagged = "#f7768e"
changed = "#ff9e64"

[kind]
added = "#9ece6a"
modified = "#7aa2f7"
deleted = "#f7768e"
renamed = "#7dcfff"
moved = "#bb9af7"
type = "#ff9e64"
quiet = "#565f89"

[diff]
removed_line = "#5f1519"
added_line = "#14471f"
quiet_line = "#292e42"
removed_text = "#f7768e"
added_text = "#9ece6a"
removed_sign = "#f7768e"
added_sign = "#9ece6a"

[syntax]
keyword = "#bb9af7"
function = "#7aa2f7"
type = "#2ac3de"
string = "#9ece6a"
constant = "#ff9e64"
comment = "#565f89"
parameter = "#e0af68"
attribute = "#7dcfff"
operator = "#89ddff"
punctuation = "#89ddff"
property = "#73daca"
special = "#f7768e"
tag = "#f7768e"
escape = "#bb9af7"
