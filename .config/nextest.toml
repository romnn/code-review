# Every test ends within a bounded time: one that waits for an event that never comes is
# terminated, with its process group, and fails, instead of hanging the run.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The two longest tests take about four minutes on Windows CI.
[[profile.default.overrides]]
filter = "test(=review::live::tests::a_history_read_again_is_the_one_read_from_the_start) | test(=migration::a_long_review_moves_into_its_archive_losing_nothing)"
slow-timeout = { period = "60s", terminate-after = 15 }
