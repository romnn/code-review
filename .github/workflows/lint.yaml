# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: lint
on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened]

env:
    MISE_GITHUB_TOKEN: ${{ github.token }}
    MISE_AUTO_INSTALL: "0"
    MISE_HTTP_RETRIES: "12"

jobs:
    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  version: 2026.7.16
                  install: false
                  cache: true
                  env: false
            - run:
                  mise install task zig github:romnn/cargo-feature-combinations
                  aqua:rustsec/rustsec/cargo-audit github:est31/cargo-udeps
                  github:rust-cross/cargo-zigbuild
            - name: Install gpui system libraries
              run: task deps:linux
            - name: Install Rust nightly
              uses: dtolnay/rust-toolchain@nightly
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true
            # review-languages' build script fetches the grammars and Helix's queries this cache
            # holds at their pins.
            # A pin bump restores the last cache, whose entries are checked on use, so only what
            # moved is fetched again, and saves a new one under its own key.
            - uses: actions/cache@v6
              with:
                  path: crates/review-languages/_cache
                  key: grammars-${{ runner.os }}-${{ hashFiles('crates/review-languages/languages.toml', 'crates/review-grammar-sources/src/**') }}
                  restore-keys: grammars-${{ runner.os }}-
            - name: Audit
              continue-on-error: true
              run: task audit
            - name: Check for unused dependencies
              run: task unused-dependencies
            - name: Lint (all feature combinations × targets)
              run: task lint:fc

    spellcheck:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  version: 2026.7.16
                  install: false
                  cache: true
                  env: false
            - run: mise install task typos
            - name: Spellcheck
              run: task spellcheck

    grammar-sync:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  version: 2026.7.16
                  install: false
                  cache: true
                  env: false
            - run: mise install task uv
            - name: Grammar sync self-test
              run: task grammars:sync:check

    ast-grep:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  version: 2026.7.16
                  install: false
                  cache: true
                  env: false
            - run: mise install task ast-grep
            - name: ast-grep
              run: task lint:ast-grep
