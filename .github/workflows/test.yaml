# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: test
on:
    push:
        branches: [main]
    workflow_call: {}
    pull_request:
        types: [opened, synchronize, reopened]

env:
    MISE_GITHUB_TOKEN: ${{ github.token }}
    MISE_AUTO_INSTALL: "0"
    MISE_HTTP_RETRIES: "12"

jobs:
    test:
        name: test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  version: 2026.7.16
                  install: false
                  cache: true
                  env: false
            - run: >-
                  mise install task aqua:nextest-rs/nextest/cargo-nextest
                  github:romnn/cargo-feature-combinations
            - name: Install gpui system libraries
              if: runner.os == 'Linux'
              run: task deps:linux
            - uses: dtolnay/rust-toolchain@stable
              with:
                  # review-ui's go-to-definition tests drive a real rust-analyzer.
                  components: rust-analyzer
            - uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true
            - name: Feature-combination tests
              run: task test:fc
            - name: Doc-tests
              run: task test:doc
