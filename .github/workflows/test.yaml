# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: test
on:
    push:
        branches: [main]
    workflow_call: {}
    pull_request:
        types: [opened, synchronize, reopened]

env:
    MISE_GITHUB_TOKEN: ${{ github.token }}
    MISE_AUTO_INSTALL: "0"
    MISE_HTTP_RETRIES: "12"

jobs:
    test:
        name: test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  version: 2026.7.16
                  install: false
                  cache: true
                  env: false
            - run: >-
                  mise install task aqua:nextest-rs/nextest/cargo-nextest
                  github:romnn/cargo-feature-combinations
            - name: Install gpui system libraries
              if: runner.os == 'Linux'
              run: task deps:linux
            - uses: dtolnay/rust-toolchain@stable
              with:
                  # review-ui's go-to-definition tests drive a real rust-analyzer.
                  components: rust-analyzer
            - uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true
            # review-languages' build script fetches the grammars and Helix's queries this cache
            # holds at their pins.
            # A pin bump restores the last cache, whose entries are checked on use, so only what
            # moved is fetched again, and saves a new one under its own key.
            - uses: actions/cache@v6
              with:
                  path: crates/review-languages/_cache
                  key: grammars-${{ runner.os }}-${{ hashFiles('crates/review-languages/languages.toml', 'crates/review-grammar-sources/src/**') }}
                  restore-keys: grammars-${{ runner.os }}-
            - name: Feature-combination tests
              # Every failure at once, instead of stopping at the first one.
              run: task test:fc -- --no-fail-fast
            - name: Doc-tests
              run: task test:doc
