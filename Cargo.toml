[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["romnn <contact@romnn.com>"]
repository = "https://github.com/romnn/code-review"
publish = false

[workspace.dependencies]
review-core = { path = "crates/review-core" }
review-ui = { path = "crates/review-ui" }

# Engine dependencies.
imara-diff = { version = "0.2", default-features = false }
# Multi-line strings written out as lines.
indoc = "2.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
sha2 = "0.10.9"
thiserror = "2.0.12"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23.2"

# Front-end dependencies: gpui and gpui-component for review-gui, the rest for review-ui and
# review-tui.
# gpui-component pins an exact gpui-pre release.
# Its optional tree-sitter highlighter stays off: it wants crates.io tree-sitter 0.26, which would
# conflict (`links = "tree-sitter"`) with the tree-sitter review-core links.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
gpui-component = { version = "=0.8.0", default-features = false }
parking_lot = "0.12"
# Fuzzy matching for the file finder.
nucleo-matcher = "0.3"
# The icons gpui-component draws, such as the find bar's clear button.
gpui-kit-assets = "=0.8.0"
toml = "1"
# Writes choices made in the app back into the configuration, keeping its comments; the same
# TOML 1.1 grammar as `toml`, which reads it.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Display widths of code lines, which set how far the views scroll sideways, in the grapheme
# clusters ratatui's buffer draws.
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Terminal front-end dependencies, of review-tui.
# crossterm is the version ratatui's crossterm backend uses, so both share one terminal;
# `osc52` puts copies on the clipboard through the terminal.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "osc52", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
# Signals from outside the terminal (hang-up, `kill`, job control), the version crossterm uses.
signal-hook = "0.3.18"

# CLI dependencies.
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"

# Test dependencies.
googletest = "0.14"
tempfile = "3"

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
self_named_module_files = "deny" # a module with submodules lives in foo/mod.rs, never foo.rs + foo/
allow_attributes_without_reason = "deny" # every #[allow] must carry reason = "..."

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
