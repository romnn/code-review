[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.5"
edition = "2024"
authors = ["romnn <contact@romnn.com>"]
repository = "https://github.com/romnn/code-review"
publish = false

[workspace.dependencies]
review-core = { path = "crates/review-core" }
review-grammar-sources = { path = "crates/review-grammar-sources" }
review-languages = { path = "crates/review-languages" }
# Each front end turns on the default features it forwards, `pdf` among them, so
# `--no-default-features` on any of them drops pdfium all the way down.
review-ui = { path = "crates/review-ui", default-features = false }
review-tui = { path = "crates/review-tui", default-features = false }

# Engine dependencies.
imara-diff = { version = "0.2", default-features = false }
# Multi-line strings written out as lines.
indoc = "2.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
sha2 = "0.11.1"
thiserror = "2.0.12"
# The one tree-sitter runtime in the graph, patched to romnn/tree-sitter below (ADR 3), and the
# grammar ABI every grammar crate exposes, from the same repository.
tree-sitter = "0.27.2"
tree-sitter-language = "0.1.5"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23.2"

# Highlighting dependencies, of review-ui (ADR 3).
# tree-house links the tree-sitter crate's runtime and compiles no C of its own; its default
# `fixtures` feature is for its own tests.
tree-house = { git = "https://github.com/romnn/tree-house", branch = "main", default-features = false }
ropey = { version = "1.6", default-features = false }
regex = "1"
# bat's syntaxes on the pure-Rust fancy-regex engine: two-face's default is Oniguruma, a C library
# the release cross-builds would have to compile.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# The tree-house tier's grammars beyond review-core's are fetched at Helix's revisions and
# compiled by review-languages' build.rs with cc.
cc = "1.2"
# review-languages' build script writes its generated module with quote, checks that it parses
# with syn and formats it with prettyplease.
prettyplease = "0.3"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "3", default-features = false, features = ["full", "parsing"] }
# Hashes cached sources the way git hashes blobs, to check them against the pinned commit.
sha1_smol = "1.0.1"
# Kills a timed-out git with its helpers, as one process group, and runs review-core's fetches in
# a session of its own, without the terminal.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }
# Reads a directory's volume and file index on Windows, which tells a clone made anew at the same
# path from the old one.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Front-end dependencies: gpui and gpui-component for review-gui, the rest for review-ui and
# review-tui.
# gpui-component, gpui-kit-assets and gpui-pre-platform each pin an exact gpui-pre release, which
# keeps the family on one gpui-pre snapshot, so these caret requirements let an upgrade move the
# whole family together.
# gpui-component's optional tree-sitter highlighter stays off: it wants crates.io tree-sitter 0.26,
# which would conflict (`links = "tree-sitter"`) with the tree-sitter review-core links.
gpui = { package = "gpui-pre", version = "0.3.9" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3.9", default-features = false }
gpui-component = { version = "0.9.0", default-features = false }
# Hands review-gui the completion of a job that runs on a thread of its own; the version gpui
# links.
futures-channel = "0.3.34"
parking_lot = "0.12"
# Fuzzy matching for the file finder.
nucleo-matcher = "0.3"
# Watches a reviewed working tree, so the review follows the disk; the version gpui links.
notify = "8.2.1"
# A pseudo-terminal for review-tui's tests, which run the app as a terminal would.
nix = { version = "0.31.3", default-features = false, features = ["term"] }
# Spans for profiling: without a subscriber, each costs only a check of its callsite.
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
# Writes the spans as a Perfetto trace, for review-tui's `trace` feature. The layer is published
# only on git, which crates that are never published may depend on.
tracing-perfetto = { git = "https://github.com/romnn/tracing-perfetto.git", rev = "75dcd7480704cf6168891fb138c77188627ded7f" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
# The icons gpui-component draws, such as the find bar's clear button.
gpui-kit-assets = "0.9.0"
toml = "1"
# Writes choices made in the app back into the configuration, keeping its comments; the same
# TOML 1.1 grammar as `toml`, which reads it.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Decodes a changed image's versions for its comparison in review-ui, which each front end draws;
# only the formats review-ui names, the version gpui links.
image = { version = "0.25.10", default-features = false }
# Reads a changed PDF's page text and renders its pages, with the pdfium library embedded at build
# time, for review-ui's `pdf` feature. Not on crates.io yet, so pinned to the owner's merge commit
# that reports encrypted documents and bounds page text.
pdfium-embed = { git = "https://github.com/romnn/pdfium-embed", rev = "1cc7d39cdc429b048b4e2564f189dae2acc135b8" }
# Display widths of code lines, which set how far the views scroll sideways, in the grapheme
# clusters ratatui's buffer draws.
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Terminal front-end dependencies, of review-tui.
# crossterm is the version ratatui's crossterm backend uses, so both share one terminal;
# `osc52` puts copies on the clipboard through the terminal.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "osc52", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
# Signals from outside the terminal (hang-up, `kill`, job control), the version crossterm uses.
signal-hook = "0.3.18"
# Draws images with the kitty graphics protocol's Unicode placeholders. review-tui builds each
# protocol image itself, never through the library's picker, which queries the terminal and
# changes tmux's settings (ADR 12); its default codecs and Chafa stay off.
ratatui-image = { version = "11.1.0", default-features = false }

# CLI dependencies.
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"

# Test dependencies.
googletest = "0.14"
# Writes an animated PNG for review-ui's tests, which `image` cannot; the version `image` links.
png = { version = "0.18.1", default-features = false }
tempfile = "3"

# The graph links exactly one tree-sitter runtime, romnn/tree-sitter (ADR 3): v0.27.2 with the
# parser's explicit-frame stack fix and the query extension tree-house calls.
# tree-sitter-language comes from the same repository, so the runtime and every grammar crate share
# one `LanguageFn`.
# A test in review-ui checks both against `cargo metadata`.
[patch.crates-io]
tree-sitter = { git = "https://github.com/romnn/tree-sitter", branch = "main" }
tree-sitter-language = { git = "https://github.com/romnn/tree-sitter", branch = "main" }

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
self_named_module_files = "deny" # a module with submodules lives in foo/mod.rs, never foo.rs + foo/
allow_attributes_without_reason = "deny" # every #[allow] must carry reason = "..."

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
