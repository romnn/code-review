[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
authors = ["romnn <contact@romnn.com>"]
repository = "https://github.com/romnn/code-review"
publish = false

[workspace.dependencies]
review-core = { path = "crates/review-core" }
review-grammar-sources = { path = "crates/review-grammar-sources" }
review-languages = { path = "crates/review-languages" }
review-ui = { path = "crates/review-ui" }
review-tui = { path = "crates/review-tui" }

# Engine dependencies.
imara-diff = { version = "0.2", default-features = false }
# Multi-line strings written out as lines.
indoc = "2.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
sha2 = "0.11.1"
thiserror = "2.0.12"
# The one tree-sitter runtime in the graph, patched to romnn/tree-sitter below (ADR 3), and the
# grammar ABI every grammar crate exposes, from the same repository.
tree-sitter = "0.27.2"
tree-sitter-language = "0.1.5"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23.2"

# Highlighting dependencies, of review-ui (ADR 3).
# tree-house links the tree-sitter crate's runtime and compiles no C of its own; its default
# `fixtures` feature is for its own tests.
tree-house = { git = "https://github.com/romnn/tree-house", branch = "main", default-features = false }
ropey = { version = "1.6", default-features = false }
regex = "1"
# bat's syntaxes on the pure-Rust fancy-regex engine: two-face's default is Oniguruma, a C library
# the release cross-builds would have to compile.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# The tree-house tier's grammars beyond review-core's are fetched at Helix's revisions and
# compiled by review-languages' build.rs with cc.
cc = "1.2"
# review-languages' build script writes its generated module with quote, checks that it parses
# with syn and formats it with prettyplease.
prettyplease = "0.3"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "3", default-features = false, features = ["full", "parsing"] }
# Hashes cached sources the way git hashes blobs, to check them against the pinned commit.
sha1_smol = "1.0.1"
# Kills a timed-out git with its helpers, as one process group.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

# Front-end dependencies: gpui and gpui-component for review-gui, the rest for review-ui and
# review-tui.
# gpui-component pins an exact gpui-pre release.
# Its optional tree-sitter highlighter stays off: it wants crates.io tree-sitter 0.26, which would
# conflict (`links = "tree-sitter"`) with the tree-sitter review-core links.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
gpui-component = { version = "=0.8.0", default-features = false }
parking_lot = "0.12"
# Fuzzy matching for the file finder.
nucleo-matcher = "0.3"
# The icons gpui-component draws, such as the find bar's clear button.
gpui-kit-assets = "=0.8.0"
toml = "1"
# Writes choices made in the app back into the configuration, keeping its comments; the same
# TOML 1.1 grammar as `toml`, which reads it.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Display widths of code lines, which set how far the views scroll sideways, in the grapheme
# clusters ratatui's buffer draws.
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Terminal front-end dependencies, of review-tui.
# crossterm is the version ratatui's crossterm backend uses, so both share one terminal;
# `osc52` puts copies on the clipboard through the terminal.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "osc52", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
# Signals from outside the terminal (hang-up, `kill`, job control), the version crossterm uses.
signal-hook = "0.3.18"

# CLI dependencies.
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"

# Test dependencies.
googletest = "0.14"
tempfile = "3"

# The graph links exactly one tree-sitter runtime, romnn/tree-sitter (ADR 3): v0.27.2 with the
# parser's explicit-frame stack fix and the query extension tree-house calls.
# tree-sitter-language comes from the same repository, so the runtime and every grammar crate share
# one `LanguageFn`.
# A test in review-ui checks both against `cargo metadata`.
[patch.crates-io]
tree-sitter = { git = "https://github.com/romnn/tree-sitter", branch = "main" }
tree-sitter-language = { git = "https://github.com/romnn/tree-sitter", branch = "main" }

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
self_named_module_files = "deny" # a module with submodules lives in foo/mod.rs, never foo.rs + foo/
allow_attributes_without_reason = "deny" # every #[allow] must carry reason = "..."

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
